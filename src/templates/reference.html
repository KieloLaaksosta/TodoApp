{% extends "layout.html" %}

{% block title %}Reference helper{% endblock %}

{% block content %}

  <div class="bibtex-form">
  <dl>

      <dt>Bibtex Key</dt>
      <dd><code>{{ ref.key }}</code></dd>

      <dt>Title</dt>
      <dd>{{ ref.title }}</dd>

      <dt>Author</dt>
      <dd>{{ ref.author }}</dd>

      <dt>Publisher</dt>
      <dd>{{ ref.publisher }}</dd>

      <dt>Year</dt>
      <dd>{{ ref.year }}</dd>

      <dt>Type</dt>
      <dd>{{ ref.type }}</dd>

  </dl>
  </div>

  <div class="form-actions">
    <a href="/" class="cancel-button">Go back</a>
    <a href="/edit_reference/{{ ref.key }}" class="submit-button">Edit</a>
    <form action="/delete_reference" method="post" onsubmit="return confirm('Delete this reference?');">
      <input type="hidden" name="bibtex_key" value="{{ ref.key }}">
      <button class="cancel-button" type="submit">Delete</button>
    </form>
  </div>

{% endblock %}
