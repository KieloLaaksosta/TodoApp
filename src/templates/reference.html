{% extends "layout.html" %}

{% block title %}Reference helper{% endblock %}

{% block content %}

<script>
  const flashMessages = document.querySelectorAll(".flash-message");

  flashMessages.forEach((message) => {
    setTimeout(() => {
      message.remove();
    }, 3000);
  });
</script>

<div class="content-wrapper">
  <h1>{{ ref.title }}</h1>
  <h2>{{ ref.author }}</h2>
</div>

{% endblock %}
