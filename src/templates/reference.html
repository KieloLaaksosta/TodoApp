{% extends "layout.html" %}

{% block title %}Reference helper{% endblock %}

{% block content %}

{% with messages = get_flashed_messages() %}
{% if messages %}
{% for message in messages %}
<p class="flash-message" role="alert">{{ message }}</p>
{% endfor %}
{% endif %}
{% endwith %}

<script>
  const flashMessages = document.querySelectorAll(".flash-message");

  flashMessages.forEach((message) => {
    setTimeout(() => {
      message.remove();
    }, 3000);
  });
</script>

<div class="content-wrapper">
  <h1>{{ ref.title }}</h1>
  <h2>{{ ref.author }}</h2>
</div>

{% endblock %}
