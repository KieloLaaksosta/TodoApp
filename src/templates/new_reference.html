<html>
    <h2>New reference</h2>

    <form action="/add_reference" method="post">
        <label for="bibtex_key">BibTeX key:</label>
        <input type="text" id="bibtex_key" name="bibtex_key" required><br><br>
        <label for="reference_type">Reference type:</label>
        <input type="text" id="reference_type" name="reference_type" required><br><br>
        <label for="author">Author:</label>
        <input type="text" id="author" name="author" required><br><br>
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" required><br><br>
        <label for="year">Year:</label>
        <input type="number" id="year" name="year" required><br><br>
        <label for="publisher">Publisher:</label>
        <input type="text" id="publisher" name="publisher" required><br><br>
        <input type="submit" value="Add Reference">
    </form>
</html>
