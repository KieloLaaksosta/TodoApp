{% extends "layout.html" %}

{% block title %}New reference{% endblock %}

{% block content %}

{% with messages = get_flashed_messages() %}
{% if messages %}
<ul class=flashes>
    {% for message in messages %}
    <li><strong>{{ message }}</strong></li>
    {% endfor %}
</ul>
{% endif %}
{% endwith %}

<div class="form-container">

    <form action="/add_reference" method="post">
        <div class="form-field">
            <label for="bibtex_key">BibTeX key:</label>
            <input type="text" id="bibtex_key" name="bibtex_key" pattern="\S+" maxlength="100" required>
        </div>
        
        <div class="form-field">
            <label for="reference_type">Reference type:</label>
            <input type="text" id="reference_type" name="reference_type" maxlength="255" required>
        </div>
        
        <div class="form-field">
            <label for="author">Author:</label>
            <input type="text" id="author" name="author" maxlength="255" required>
        </div>
        
        <div class="form-field">      
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" maxlength="255" required>
        </div>
        
        <div class="form-field">     
            <label for="year">Year:</label>
            <input type="number" id="year" name="year" min="1" max="{{ current_year }}" required>
        </div>
        
        <div class="form-field">      
            <label for="publisher">Publisher:</label>
            <input type="text" id="publisher" name="publisher" maxlength="255" required>
        </div>
        
        <div class="form-actions">
            <a href="/" class="cancel-button">Cancel</a>
            <button type="submit" class="submit-button">
                Add reference
            </button>
        </div>
    </form>

</div>

{% endblock %}
