<html>
<h2>New reference</h2>

{% with messages = get_flashed_messages() %}
{% if messages %}
<ul class=flashes>
    {% for message in messages %}
    <li><strong>{{ message }}</strong></li>
    {% endfor %}
</ul>
{% endif %}
{% endwith %}

<form action="/add_reference" method="post">
    <label for="bibtex_key">BibTeX key:</label>
    <input type="text" id="bibtex_key" name="bibtex_key"
        title=" Only English letters, numbers, and the special characters _ . : and - are allowed." maxlength="100"
        required><br><br>
    <label for="reference_type">Reference type:</label>
    <select id="reference_type" name="reference_type">
        {% for ref_type in ref_types %}
        <option value="{{ ref_type }}">{{ ref_type }}</option>
        {% endfor %}
    </select>
    <br><br>
    <label for=" author">Author:</label>
    <input type="text" id="author" name="author" pattern=".*\S+.*" maxlength="255" required><br><br>
    <label for="title">Title:</label>
    <input type="text" id="title" name="title" pattern=".*\S+.*" maxlength="255" required><br><br>
    <label for="year">Year:</label>
    <input type="number" id="year" name="year" min="1" max="{{ current_year }}" required><br><br>
    <label for="publisher">Publisher:</label>
    <input type="text" id="publisher" name="publisher" pattern=".*\S+.*" maxlength="255" required><br><br>
    <input type="submit" value="Add Reference">
</form>

</html>
