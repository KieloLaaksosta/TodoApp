<html>
<h2>New reference</h2>

<form action="/add_reference" method="post">
    <label for="bibtex_key">BibTeX key:</label>
    <input type="text" id="bibtex_key" name="bibtex_key" maxlength="100" required><br><br>
    <label for="reference_type">Reference type:</label>
    <input type="text" id="reference_type" name="reference_type" maxlength="255" required><br><br>
    <label for="author">Author:</label>
    <input type="text" id="author" name="author" maxlength="255" required><br><br>
    <label for="title">Title:</label>
    <input type="text" id="title" name="title" maxlength="255" required><br><br>
    <label for="year">Year:</label>
    <input type="number" id="year" name="year" min="1" max="2100" required><br><br>
    <label for="publisher">Publisher:</label>
    <input type="text" id="publisher" name="publisher" maxlength="255" required><br><br>
    <input type="submit" value="Add Reference">
</form>

</html>
