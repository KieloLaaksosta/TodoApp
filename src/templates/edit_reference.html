{% extends "layout.html" %}

{% block title %}Edit reference{% endblock %}

{% block content %}

<form action="/update_reference", method="post">
        <div class="form-field">
            <label for="bibtex_key">BibTeX key:</label>
            <input type="text" id="bibtex_key" name="bibtex_key" pattern="\S+" maxlength="100" value="{{ref.key}}" required>
        </div>

        <div class="form-field">
            <label for="reference_type">Reference type:</label>
            <select id="reference_type" name="reference_type">
                {% for ref_type in ref_types %}
                <option value="{{ ref_type }}">{{ ref.type }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-field">
            <label for="author">Author:</label>
            <input type="text" id="author" name="author" maxlength="255" value="{{ref.author}}" required>
        </div>

        <div class="form-field">
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" maxlength="255" value="{{ref.title}}" required>
        </div>

        <div class="form-field">
            <label for="year">Year:</label>
            <input type="number" id="year" name="year" min="1" max="{{ current_year }}" value="{{ref.year}}" required>
        </div>

        <div class="form-field">
            <label for="publisher">Publisher:</label>
            <input type="text" id="publisher" name="publisher" maxlength="255" value="{{ref.publisher}}" required>
        </div>

        <div class="form-actions">
            <a href="/" class="cancel-button">Cancel</a>
            <input type="hidden" name="old_key" value="{{ ref.key }}">
            <button type="submit" class="submit-button">
                Update reference
            </button>
        </div>
</form>

{% endblock %}
