<!DOCTYPE html>
<html>

<head>
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="/static/main.css">
</head>

<body>
    <div class="header-container">
        <h1>Reference helper</h1>
    </div>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
    {% for message in messages %}
    <p class="flash-message" role="alert">{{ message }}</p>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <div class="content-wrapper">

        {% block content %}{% endblock %}

    </div>
</body>

<script>
    function scheduleFlashRemoval(root = document) {
        root.querySelectorAll(".flash-message:not([data-flash-scheduled])").forEach((message) => {
            message.dataset.flashScheduled = "true";
            setTimeout(() => {
                message.remove();
            }, 3000);
        });
    }

    document.addEventListener("DOMContentLoaded", () => {
        scheduleFlashRemoval();

        const observer = new MutationObserver((mutations) => {
            for (const mutation of mutations) {
                for (const node of mutation.addedNodes) {
                    if (node.nodeType === Node.ELEMENT_NODE) {
                        if (node.matches?.(".flash-message")) {
                            scheduleFlashRemoval(node.parentElement || document);
                        } else if (node.querySelectorAll) {
                            scheduleFlashRemoval(node);
                        }
                    }
                }
            }
        });

        observer.observe(document.body, { childList: true, subtree: true });
    });
</script>

</html>
