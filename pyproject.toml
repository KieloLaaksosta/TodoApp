[project]
name = "todoapp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Joonatan Paalanen", email = "joonatan.paalanen@helsinki.fi" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "robotframework>=7.5.1",
]

[project.scripts]
todoapp = "todoapp:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pylint>=4.1.3",
    "pytest>=9.2.0",
]
