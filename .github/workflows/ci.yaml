name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: sqlite:///database.db
      SECRET_KEY: 6398a85438fd9c51cf2a80a1b77468cdee76a32506a6262b677238f6282aaa43
      TEST_ENV: true
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright browser
        run: uv run rfbrowser install chromium

      - name: Run robot tests
        run: bash run_robot_tests.sh
